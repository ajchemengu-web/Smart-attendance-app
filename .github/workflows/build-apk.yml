name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Signed with the debug keystore (android/app/build.gradle.kts) —
      # installable/sideloadable, not a Play Store submission build.
      # API_BASE_URL is the same repo Actions variable the web build
      # uses (Settings > Secrets and variables > Actions > Variables).
      - run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
